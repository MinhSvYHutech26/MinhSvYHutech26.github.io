<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLibrary - Kho tài liệu Y khoa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fa;--ink:#16293b;--mut:#62788c;--line:#dde7ee;--eo:#d9437a;--eo2:#fde8f0;--he:#5b3a8c;--he2:#ece6f6;--ok:#1f9d7a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
a{color:inherit;text-decoration:none}
#nav{width:300px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:block;font-weight:800;font-size:20px;padding:0 8px 14px}.logo b{color:var(--eo)}
#sq{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;margin-bottom:12px}
#sq:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--he);outline-offset:1px}
.sg{font-size:12px;font-weight:600;color:var(--he);text-transform:uppercase;letter-spacing:.06em;padding:14px 8px 4px}
.nl{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;color:#3b5266;font-size:14px}
.nl:hover{background:var(--bg)}.nl.on{background:var(--he2);color:var(--he);font-weight:600}.nl em{font-style:normal;color:var(--mut);font-size:12px;flex:none}
main{flex:1;min-width:0;padding:34px clamp(16px,4vw,56px)}
#v>*{max-width:780px}
article{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,44px);font:17px/1.8 'Source Serif 4',Georgia,serif}
article h1,h1{font-family:'Be Vietnam Pro',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-bottom:14px}
article h2{font:700 21px 'Be Vietnam Pro',sans-serif;margin:30px 0 10px;padding-left:12px;border-left:4px solid var(--eo)}
article h3{font:600 17px 'Be Vietnam Pro',sans-serif;margin:20px 0 6px}
article p,article ul{margin-bottom:12px}article ul{padding-left:22px}article li{margin-bottom:6px}
.toc{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;font:500 13px 'Be Vietnam Pro',sans-serif}.toc a{background:var(--he2);color:var(--he);padding:5px 12px;border-radius:99px;cursor:pointer}
.tw{overflow-x:auto;margin:12px 0 18px}table{border-collapse:collapse;font:14px/1.5 'Be Vietnam Pro',sans-serif;min-width:640px;width:100%}
th{background:var(--he2);color:var(--he);text-align:left}th,td{padding:8px 12px;border:1px solid var(--line);vertical-align:top}tr:nth-child(even) td{background:#fafcfd}
blockquote{background:var(--eo2);border-left:4px solid var(--eo);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:10px;font-size:16px}
code{background:var(--he2);padding:1px 6px;border-radius:5px}
.qh{margin-top:40px!important}
.qc{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:14px;font:15px/1.55 'Be Vietnam Pro',sans-serif}.qc>p{margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--he)}.opt.ok{background:#e2f4ee;border-color:var(--ok)}.opt.no{background:var(--eo2);border-color:var(--eo)}
.ex{margin-top:6px;padding:10px 14px;background:#fff;border-radius:10px;border:1px dashed var(--line)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px;font-weight:600;color:var(--he)}
.sub{color:var(--mut);margin-bottom:18px}.cont{display:inline-block;background:var(--eo);color:#fff;font-weight:600;padding:11px 20px;border-radius:12px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}.card h2{font-size:16px;color:var(--he);margin-bottom:6px}
.card a{display:block;padding:6px 0}.card a:hover{color:var(--eo)}
.sr{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}.sr span{display:block;color:var(--mut);font-size:14px}
.cap{font-size:13px;color:var(--he);font-weight:600;margin-bottom:4px}
#mb{display:none}
@media(max-width:820px){body{display:block}#nav{display:none;width:100%;height:auto;position:static;max-height:70vh}#nav.open{display:block}#mb{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:#fff;font:600 14px inherit;text-align:left}}
</style>
</head>
<body>
<button id="mb" onclick="$('#nav').classList.toggle('open')">☰ Mục lục</button>
<nav id="nav"><a class="logo" href="#home">Med<b>Library</b></a><input id="sq" placeholder="Tìm trong kho tài liệu..." oninput="srch(this.value)"><div id="sd"></div></nav>
<main id="v"><p class="sub">Đang tải...</p></main>
<script>
const $=s=>document.querySelector(s),K='medlib-v1';
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({res:{},wrong:{}},S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=[],flat=[],P={},cur='';

/* Markdown rút gọn: #, ##, ###, danh sách "- ", bảng |, trích dẫn >, **đậm**, *nghiêng* */
function md(t){const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
  const L=t.split('\n');let o='',i=0;
  while(i<L.length){const l=L[i];
    if(/^# /.test(l)){o+=`<h1>${inl(l.slice(2))}</h1>`;i++}
    else if(/^## /.test(l)){o+=`<h2 id="h${i}">${inl(l.slice(3))}</h2>`;i++}
    else if(/^### /.test(l)){o+=`<h3>${inl(l.slice(4))}</h3>`;i++}
    else if(/^\|/.test(l)){const r=[],c=x=>x.replace(/^\||\|$/g,'').split('|').map(s=>s.trim());while(i<L.length&&/^\|/.test(L[i]))r.push(L[i++]);
      o+='<div class="tw"><table><tr>'+c(r[0]).map(x=>`<th>${inl(x)}</th>`).join('')+'</tr>'+r.slice(1).map(x=>'<tr>'+c(x).map(y=>`<td>${inl(y)}</td>`).join('')+'</tr>').join('')+'</table></div>'}
    else if(/^- /.test(l)){o+='<ul>';while(i<L.length&&/^- /.test(L[i]))o+=`<li>${inl(L[i++].slice(2))}</li>`;o+='</ul>'}
    else if(/^> /.test(l)){while(i<L.length&&/^> /.test(L[i]))o+=`<blockquote>${inl(L[i++].slice(2))}</blockquote>`}
    else{if(l.trim())o+=`<p>${inl(l)}</p>`;i++}}
  return o}

/* Mỗi chương là 1 file .md. Phần "## Trắc nghiệm" gồm các khối: Q:, A. B. C. D., =: đáp án, E: giải thích */
function parse(t){const[th,qs='']=t.split(/\n## Trắc nghiệm\n/);
  const Q=qs.split(/\n(?=Q: )/).filter(x=>x.startsWith('Q: ')).map(b=>{const g=k=>(b.match(new RegExp('^'+k+'(.*)$','m'))||[])[1]||'';
    return{q:g('Q: '),o:['A','B','C','D'].map(k=>g(k+'\\. ')),a:'ABCD'.indexOf(g('=: ').trim()),e:g('E: ')}});
  return{th,Q}}
async function get(id){if(!P[id])P[id]=parse(await(await fetch(`content/${id}.md`)).text());return P[id]}

const qc=(id,q,i)=>`<div class="qc" id="q-${id}-${i}"><p><b>Câu ${i+1}.</b> ${esc(q.q)}</p>${q.o.map((o,k)=>`<button class="opt" onclick="ans('${id}',${i},${k})"><b>${'ABCD'[k]}.</b> ${esc(o)}</button>`).join('')}<div class="ex" hidden></div></div>`;
function ans(id,i,k){const q=P[id].Q[i],ok=k==q.a,d=document.getElementById(`q-${id}-${i}`);
  (S.res[id]=S.res[id]||{})[i]=ok?1:0;if(ok)delete S.wrong[id+'#'+i];else S.wrong[id+'#'+i]=1;save();
  d.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  const e=d.querySelector('.ex');e.hidden=false;e.innerHTML=(ok?'<b>Chính xác.</b> ':`<b>Đáp án đúng: ${'ABCD'[q.a]}.</b> `)+esc(q.e);side()}

function side(){$('#sd').innerHTML=`<a class="nl ${cur=='wrong'?'on':''}" href="#wrong">Sổ câu sai <em>${Object.keys(S.wrong).length}</em></a>`+
  M.map(g=>`<div class="sg">${esc(g.s)}</div>`+g.c.map(c=>{const r=Object.values(S.res[c.id]||{});return`<a class="nl ${cur==c.id?'on':''}" href="#${c.id}"><span>${esc(c.t)}</span>${r.length?`<em>${r.reduce((a,b)=>a+b,0)}/${r.length}</em>`:''}</a>`}).join('')).join('')}

function home(){const L=flat.find(x=>x.id==S.last),a=Object.values(S.res).flatMap(Object.values),ok=a.reduce((x,y)=>x+y,0);
  $('#v').innerHTML=`<h1>Kho tài liệu Y khoa</h1><p class="sub">Đọc lý thuyết, làm trắc nghiệm ngay cuối chương. Câu làm sai tự động vào Sổ câu sai để ôn lại.${a.length?` Đã làm ${a.length} câu, đúng ${Math.round(ok/a.length*100)}%.`:''}</p>`+
  (L?`<a class="cont" href="#${L.id}">Tiếp tục: ${esc(L.t)}</a>`:'')+M.map(g=>`<div class="card"><h2>${esc(g.s)}</h2>${g.c.map(c=>`<a href="#${c.id}">${esc(c.t)}</a>`).join('')}</div>`).join('')}

async function wrong(){const ks=Object.keys(S.wrong);$('#v').innerHTML=`<h1>Sổ câu sai</h1><p class="sub">${ks.length?'Làm đúng lại một câu thì câu đó tự rời khỏi sổ.':'Chưa có câu sai nào. Làm trắc nghiệm ở các chương để bắt đầu.'}</p>`;
  let h='';for(const k of ks){const[id,i]=k.split('#'),p=await get(id);if(p.Q[i])h+=`<div class="cap">${esc(flat.find(x=>x.id==id).t)}</div>`+qc(id,p.Q[i],+i)}
  if(cur=='wrong')$('#v').insertAdjacentHTML('beforeend',h)}

async function route(){const h=location.hash.slice(1)||'home';cur=h;$('#sq').value='';$('#nav').classList.remove('open');side();scrollTo(0,0);
  if(h=='home')return home();if(h=='wrong')return wrong();
  const c=flat.find(x=>x.id==h);if(!c){location.hash='home';return}
  S.last=h;save();const p=await get(h);if(cur!=h)return;const i=flat.indexOf(c);
  const toc='<div class="toc">'+p.th.split('\n').map((l,n)=>/^## /.test(l)?`<a onclick="document.getElementById('h${n}').scrollIntoView({behavior:'smooth'})">${esc(l.slice(3))}</a>`:'').join('')+'</div>';
  $('#v').innerHTML=`<article>${md(p.th).replace('</h1>','</h1>'+toc)}${p.Q.length?`<h2 class="qh">Trắc nghiệm (${p.Q.length} câu)</h2>`+p.Q.map((q,n)=>qc(h,q,n)).join(''):''}</article>
  <div class="pn"><a href="#${i>0?flat[i-1].id:'home'}">${i>0?'← '+esc(flat[i-1].t):'← Trang chủ'}</a>${i<flat.length-1?`<a href="#${flat[i+1].id}">${esc(flat[i+1].t)} →</a>`:''}</div>`}

let st;function srch(v){clearTimeout(st);st=setTimeout(async()=>{v=v.trim().toLowerCase();if(v.length<2)return route();let h='';
  for(const c of flat){const p=await get(c.id);p.th.split('\n').forEach(l=>{if(l.toLowerCase().includes(v)&&h.length<60000)h+=`<a class="sr" href="#${c.id}"><b>${esc(c.t)}</b><span>${esc(l.replace(/[#*|>]/g,' ').replace(/^\s*-\s*/,'').trim().slice(0,220))}</span></a>`})}
  $('#v').innerHTML=`<h1>Kết quả cho "${esc(v)}"</h1>`+(h||'<p class="sub">Không tìm thấy.</p>')},250)}

(async()=>{try{M=await(await fetch('content/index.json')).json()}catch(e){$('#v').innerHTML='<h1>Không tải được kho tài liệu</h1><p class="sub">Hãy mở qua đường link GitHub Pages, đừng bấm đúp mở trực tiếp file trên máy.</p>';return}
  flat=M.flatMap(g=>g.c);addEventListener('hashchange',route);route()})();
</script>
</body>
</html>
