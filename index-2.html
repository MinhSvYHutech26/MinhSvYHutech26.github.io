<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedMate - Trợ thủ học Y</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fa;--ink:#12263a;--mut:#62788c;--line:#dde7ee;--card:#fff;--eo:#d9437a;--eo2:#fde8f0;--he:#5b3a8c;--he2:#ece6f6;--ok:#1f9d7a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
nav{width:220px;padding:22px 14px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex:none}
.logo{font-weight:800;font-size:20px;padding:0 10px 18px;letter-spacing:-.3px}.logo b{color:var(--eo)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font:inherit;color:var(--mut);cursor:pointer;font-weight:500}
nav button:hover{background:var(--bg)}nav button.on{background:var(--he2);color:var(--he);font-weight:600}
main{flex:1;padding:30px clamp(16px,4vw,48px);max-width:1000px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}h2{font-size:17px;font-weight:600;margin:0 0 12px}
.sub{color:var(--mut);margin-bottom:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{border-radius:14px;padding:16px;background:var(--he2)}.stat:nth-child(2){background:var(--eo2)}.stat:nth-child(3){background:#e2f4ee}.stat:nth-child(4){background:#fff3dc}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--he);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1;min-width:140px}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--eo);color:#fff;flex:none;width:auto}
.btn.g{background:var(--he2);color:var(--he)}.btn.s{padding:6px 12px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bars i{display:block;background:var(--he);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.fc{text-align:center;padding:34px 20px;border-radius:16px;background:linear-gradient(160deg,#fff,var(--he2));border:1px solid var(--line);min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.fc .q{font-size:20px;font-weight:600;white-space:pre-wrap}.fc .a{color:var(--he);white-space:pre-wrap}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--he2);color:var(--he);font-weight:600}
.ring{width:230px;height:230px;border-radius:50%;margin:10px auto 20px;display:grid;place-items:center;background:conic-gradient(var(--eo) calc(var(--p)*1%),var(--eo2) 0)}
.ring div{width:190px;height:190px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring b{font-size:46px;font-weight:800;letter-spacing:-1px;display:block;line-height:1}.ring span{color:var(--mut);font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.item .t{flex:1}.item.done .t{text-decoration:line-through;color:var(--mut)}.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.due{font-size:13px;color:var(--mut)}.due.late{color:var(--eo);font-weight:600}
.empty{color:var(--mut);padding:8px 0}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:10px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.logo{display:none}nav button{white-space:nowrap;width:auto}}
@media(prefers-reduced-motion:no-preference){main>*{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 18s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:#f6c6d8;top:-120px;right:-80px}.b2{width:380px;height:380px;background:#d9ccef;bottom:-120px;left:15%;animation-delay:-9s}
@keyframes fl{to{transform:translate(-60px,50px) scale(1.15)}}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 28px 74px;border-radius:22px;color:#fff;background:linear-gradient(120deg,var(--he),var(--eo));margin-bottom:16px}
.hero h1{margin-bottom:6px}.hero p{opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips span{background:#ffffff26;padding:5px 12px;border-radius:99px;font-size:13px}
.lv{width:124px;height:124px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff40 0);animation:pulse 2.4s ease-in-out infinite}
.lv div{width:100px;height:100px;border-radius:50%;background:#6b3b94;display:grid;place-items:center;text-align:center;line-height:1}.lv b{font-size:42px;font-weight:800;display:block}.lv span{font-size:12px;opacity:.8}
@keyframes pulse{50%{transform:scale(1.05)}}
.ecg{position:absolute;left:0;bottom:6px;width:100%;height:56px}.ecg path{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:ecg 3.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-600}}
.bar{height:8px;border-radius:9px;background:var(--he2);overflow:hidden;flex:1}.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--he),var(--eo));border-radius:9px;transition:width .6s}
.qr{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 0;font:inherit;text-align:left;cursor:pointer;color:inherit}.qr:first-of-type{border-top:0}.qr span:first-child{width:160px}
.heatw{overflow-x:auto}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);grid-auto-columns:16px;gap:4px;width:max-content}.heat s{border-radius:4px;background:#e8eef3}
.l1{background:#f6c6d8!important}.l2{background:#ee8fb3!important}.l3{background:var(--eo)!important}.l4{background:#a1245a!important}
.bd{display:inline-block;padding:6px 14px;margin:0 8px 8px 0;border-radius:99px;font-weight:600;font-size:13px;background:#fff3dc;color:#9a6a00}.bd.lock{background:#eef2f5;color:#9aabb8}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--he);transform:translateX(4px)}.opt.ok{background:#e2f4ee;border-color:var(--ok)}.opt.no{background:var(--eo2);border-color:var(--eo);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fc{animation:flip .55s cubic-bezier(.2,.8,.2,1)}@keyframes flip{from{opacity:0;transform:perspective(800px) rotateY(-70deg)}}
#hud{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:99px;box-shadow:0 8px 24px #12263a1f;font-size:13px}
#hud i{width:70px;height:6px;border-radius:9px;background:var(--he2);overflow:hidden}#hud u{display:block;height:100%;background:var(--eo);transition:width .6s}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-weight:600;font-size:14px;animation:tin .3s,tout .4s 2.5s forwards}
.toast.big{animation:tin .3s,tout .4s 5s forwards;border-radius:16px;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
@media(max-width:720px){.hero{flex-direction:column-reverse;align-items:flex-start}.qr span:first-child{width:120px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="v"></main>
<script>
/* ===== Cấu hình: sửa danh sách môn ở đây ===== */
const SUBJ=["Giải phẫu","Sinh lý","Mô học","Hóa sinh","Sinh học tế bào","Di truyền","Vật lý y sinh","Khác"];
const TABS=[["home","Tổng quan"],["cards","Flashcard"],["quiz","Thử thách"],["timer","Tập trung"],["tasks","Lịch & Deadline"],["data","Dữ liệu"]];
const K="medmate-v1";
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({cards:[],tasks:[],log:[],rev:{}},S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const opts=(sel)=>SUBJ.map(s=>`<option ${s==sel?'selected':''}>${s}</option>`).join('');
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const minsOn=k=>S.log.filter(l=>dk(l.t)==k).reduce((a,l)=>a+l.m,0);
let cur='home';

function go(n){cur=n;$('#nav').innerHTML='<div class="logo">Med<b>Mate</b></div>'+TABS.map(t=>`<button class="${t[0]==n?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');V[n]();paint()}

const V={
home(){
  const now=Date.now(),due=S.cards.filter(c=>c.due<=now).length;
  const pend=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'));
  let streak=0;for(let i=0;i<400;i++){const k=dk(now-i*864e5);if(minsOn(k)||S.rev[k])streak++;else if(i>0)break;else continue}
  const days=[...Array(7)].map((_,i)=>{const t=now-(6-i)*864e5;return[['CN','T2','T3','T4','T5','T6','T7'][new Date(t).getDay()],minsOn(dk(t))]});
  const mx=Math.max(30,...days.map(d=>d[1])),h=new Date().getHours();
  $('#v').innerHTML=`<h1>${h<11?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối'}, bác sĩ tương lai</h1>
  <p class="sub">Mỗi ngày một ít, đến kỳ thi sẽ nhẹ nhàng hơn nhiều.</p>
  <div class="grid"><div class="stat"><b>${minsOn(dk(now))} phút</b><span>Đã tập trung hôm nay</span></div>
  <div class="stat"><b>${due}</b><span>Thẻ cần ôn ngay</span></div>
  <div class="stat"><b>${pend.length}</b><span>Việc chưa xong</span></div>
  <div class="stat"><b>${streak} ngày</b><span>Chuỗi học liên tiếp</span></div></div>
  <div class="box"><h2>7 ngày gần nhất (phút tập trung)</h2><div class="bars">${days.map(d=>`<div><i style="height:${d[1]/mx*90}px"></i>${d[0]}<br>${d[1]}</div>`).join('')}</div></div>
  <div class="box"><h2>Sắp tới</h2>${pend.slice(0,4).map(taskRow).join('')||'<p class="empty">Chưa có việc nào. Thêm deadline ở mục Lịch & Deadline.</p>'}</div>`},

cards(){
  const now=Date.now(),dueL=S.cards.filter(c=>c.due<=now).sort((a,b)=>a.due-b.due);
  $('#v').innerHTML=`<h1>Flashcard</h1><p class="sub">Ôn lặp lại ngắt quãng: thẻ khó hiện thường xuyên, thẻ dễ thưa dần.</p>
  <div class="box" id="rv"></div>
  <div class="box"><h2>Thêm thẻ mới</h2><div class="row"><select id="cs">${opts()}</select></div>
  <div class="row"><textarea id="cq" placeholder="Câu hỏi hoặc thuật ngữ (VD: Thần kinh nào chi phối cơ delta?)"></textarea><textarea id="ca" placeholder="Đáp án"></textarea></div>
  <button class="btn" onclick="addCard()">Thêm thẻ</button></div>
  <div class="box"><h2>Tất cả thẻ (${S.cards.length})</h2>${S.cards.slice(-30).reverse().map(c=>`<div class="item"><span class="tag">${esc(c.s)}</span><span class="t">${esc(c.q)}</span><button class="x" aria-label="Xóa" onclick="delCard(${c.id})">×</button></div>`).join('')||'<p class="empty">Chưa có thẻ nào.</p>'}</div>`;
  showCard()},

timer(){
  $('#v').innerHTML=`<h1>Tập trung</h1><p class="sub">25 phút học, 5 phút nghỉ. Thời gian được ghi lại theo môn.</p>
  <div class="box" style="text-align:center"><div class="row" style="justify-content:center"><select id="ts" style="max-width:240px" onchange="T.subj=this.value">${opts(T.subj)}</select></div>
  <div class="ring" id="rg"><div><p><b id="tm"></b><span id="tmode"></span></p></div></div>
  <button class="btn" id="tgo" onclick="tgo()"></button> <button class="btn g" onclick="trs()">Đặt lại</button></div>
  <div class="box"><h2>Theo môn (tổng cộng)</h2>${SUBJ.map(s=>[s,S.log.filter(l=>l.s==s).reduce((a,l)=>a+l.m,0)]).filter(x=>x[1]).map(x=>`<div class="item"><span class="t">${x[0]}</span><b>${(x[1]/60).toFixed(1)} giờ</b></div>`).join('')||'<p class="empty">Chưa có phiên nào hoàn thành.</p>'}</div>`},

tasks(){
  $('#v').innerHTML=`<h1>Lịch & Deadline</h1><p class="sub">Bài tập, kiểm tra, thi giữa kỳ, tất cả ở một chỗ.</p>
  <div class="box"><div class="row"><input id="tt" placeholder="Việc cần làm (VD: Thi giữa kỳ Giải phẫu)"><input id="td" type="date"><select id="tj">${opts()}</select></div>
  <button class="btn" onclick="addTask()">Thêm việc</button></div>
  <div class="box">${[...S.tasks].sort((a,b)=>(a.done-b.done)||(a.d||'9').localeCompare(b.d||'9')).map(taskRow).join('')||'<p class="empty">Chưa có việc nào.</p>'}</div>`},

data(){
  $('#v').innerHTML=`<h1>Dữ liệu</h1><p class="sub">Dữ liệu lưu ngay trong trình duyệt này. Hãy xuất bản sao lưu định kỳ, nhất là trước khi xóa lịch sử duyệt web.</p>
  <div class="box"><div class="row"><button class="btn" onclick="exp()">Xuất sao lưu (.json)</button><label class="btn g" style="text-align:center">Nhập sao lưu<input type="file" accept=".json" hidden onchange="imp(this)"></label></div></div>
  <div class="box"><h2>Hướng phát triển tiếp theo</h2><p class="sub" style="margin:0">Thêm môn học và đề cương, ghi chú theo bài, ngân hàng câu hỏi trắc nghiệm, bảng tra cứu giải phẫu/xét nghiệm, tính điểm GPA, và đồng bộ giữa điện thoại với máy tính.</p></div>`}
};

/* ===== Flashcard (thuật toán SM-2 rút gọn) ===== */
let shown=false;
function showCard(){
  const c=S.cards.filter(c=>c.due<=Date.now()).sort((a,b)=>a.due-b.due)[0],r=$('#rv');if(!r)return;shown=false;
  if(!c){r.innerHTML=`<div class="fc"><div class="q">${S.cards.length?'Hết thẻ cần ôn. Làm tốt lắm!':'Thêm thẻ đầu tiên ở bên dưới để bắt đầu.'}</div></div>`;return}
  r.innerHTML=`<div class="fc"><span class="tag" style="align-self:center">${esc(c.s)}</span><div class="q">${esc(c.q)}</div><div class="a" id="an" hidden>${esc(c.a)}</div></div>
  <div class="row" style="margin:14px 0 0;justify-content:center" id="ac"><button class="btn" onclick="rev1()">Hiện đáp án</button></div>`;
  window._c=c}
function rev1(){$('#an').hidden=false;$('#ac').innerHTML=[['Quên',0],['Khó',1],['Tốt',2],['Dễ',3]].map(x=>`<button class="btn ${x[1]?'g':''}" onclick="rate(${x[1]})">${x[0]}</button>`).join('')}
function rate(q){const c=window._c;
  if(q==0){c.iv=0;c.ef=Math.max(1.3,(c.ef||2.5)-.2);c.due=Date.now()+6e5}
  else{c.ef=Math.max(1.3,(c.ef||2.5)+[0,-.15,0,.15][q]);c.iv=q==1?Math.max(1,Math.round((c.iv||1)*1.2)):!c.iv?(q==3?3:1):Math.round(c.iv*c.ef*(q==3?1.3:1));c.due=Date.now()+c.iv*864e5}
  const k=dk(Date.now());S.rev[k]=(S.rev[k]||0)+1;save();showCard()}
function addCard(){const q=$('#cq').value.trim(),a=$('#ca').value.trim();if(!q||!a)return;S.cards.push({id:Date.now(),s:$('#cs').value,q,a,due:Date.now(),iv:0,ef:2.5});save();V.cards()}
function delCard(id){S.cards=S.cards.filter(c=>c.id!=id);save();V.cards()}

/* ===== Công việc ===== */
function taskRow(t){let d='';if(t.d){const n=Math.ceil((new Date(t.d+'T23:59')-Date.now())/864e5);d=`<span class="due ${n<=2&&!t.done?'late':''}">${n<0?'Quá hạn '+(-n)+' ngày':n==0?'Hôm nay':'Còn '+n+' ngày'}</span>`}
  return `<div class="item ${t.done?'done':''}"><input type="checkbox" style="width:auto" ${t.done?'checked':''} onchange="tick(${t.id})"><span class="t">${esc(t.t)} <span class="tag">${esc(t.s)}</span></span>${d}<button class="x" aria-label="Xóa" onclick="delTask(${t.id})">×</button></div>`}
function addTask(){const t=$('#tt').value.trim();if(!t)return;S.tasks.push({id:Date.now(),t,d:$('#td').value,s:$('#tj').value,done:false});save();V.tasks()}
function tick(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();go(cur)}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!=id);save();go(cur)}

/* ===== Đồng hồ tập trung (chạy theo mốc thời gian, không lệch khi chuyển tab) ===== */
let T={run:false,end:0,left:1500,mode:'f',subj:SUBJ[0]};
const dur=()=>T.mode=='f'?1500:300;
function tgo(){if(T.run){T.run=false}else{T.end=Date.now()+T.left*1e3;T.run=true}paint()}
function trs(){T.run=false;T.left=dur();paint()}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function paint(){const e=$('#tm');document.title=T.run?fmt(T.left)+' - MedMate':'MedMate - Trợ thủ học Y';if(!e)return;
  e.textContent=fmt(T.left);$('#tmode').textContent=T.mode=='f'?'Đang học':'Nghỉ ngơi';$('#tgo').textContent=T.run?'Tạm dừng':'Bắt đầu';$('#rg').style.setProperty('--p',(1-T.left/dur())*100)}
setInterval(()=>{if(!T.run)return;T.left=Math.max(0,Math.round((T.end-Date.now())/1e3));
  if(!T.left){T.run=false;beep();if(T.mode=='f'){S.log.push({t:Date.now(),m:25,s:T.subj});save()}T.mode=T.mode=='f'?'b':'f';T.left=dur();if(cur=='timer')V.timer()}paint()},500);

/* ===== Sao lưu ===== */
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='medmate-'+dk(Date.now())+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cards))throw 0;S=Object.assign({cards:[],tasks:[],log:[],rev:{}},d);save();go('home')}catch(e){alert('File không hợp lệ. Hãy chọn file sao lưu của MedMate.')}};r.readAsText(f)}

/* ===== v2: XP, nhiệm vụ ngày, thử thách, hiệu ứng ===== */
document.body.insertAdjacentHTML('beforeend','<div class="blob b1"></div><div class="blob b2"></div><div id="hud"></div><div id="toasts"></div>');
const RANKS=["Tân sinh viên","Thực hành viên","Thực tập sinh","Nội trú","Bác sĩ trẻ","Chuyên khoa","Giáo sư"];
const FACTS=["Xương đùi là xương dài và khỏe nhất cơ thể người.","Não chỉ nặng khoảng 2% cơ thể nhưng dùng khoảng 20% năng lượng.","Giác mạc không có mạch máu, nó nhận oxy trực tiếp từ không khí.","Cơ bàn đạp trong tai giữa là cơ vân nhỏ nhất cơ thể.","Hồng cầu trưởng thành không có nhân.","Tim đập khoảng 100.000 lần mỗi ngày.","Người trưởng thành có 206 xương, trẻ sơ sinh có hơn 270 xương nhỏ dần hợp lại."];
const lvOf=x=>Math.floor(Math.sqrt((x||0)/40))+1;
const lvInfo=x=>{x=x||0;const l=lvOf(x),a=40*(l-1)**2,b=40*l*l;return{l,p:(x-a)/(b-a)*100,need:b-x,rank:RANKS[Math.min(6,Math.floor((l-1)/2))]}};
function today(){const d=dk(Date.now());if(!S.q||S.q.d!=d)S.q={d,rev:0,foc:0,task:0,done:false};return S.q}
function streak(){let n=0;S.act=S.act||{};for(let i=0;i<400;i++){const k=dk(Date.now()-i*864e5);if(minsOn(k)||S.rev[k]||S.act[k])n++;else if(i>0)break}return n}
function pop(m,big){const e=document.createElement('div');e.className='toast'+(big?' big':'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),big?5500:3000)}
function hud(){const i=lvInfo(S.xp);$('#hud').innerHTML=`<b>Cấp ${i.l}</b><i><u style="width:${i.p}%"></u></i><span>🔥 ${streak()}</span>`}
function cnt(e,to){const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/800);e.textContent=Math.round(to*(1-(1-k)**3));if(k<1)requestAnimationFrame(s)})(t0)}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const g=c.getContext('2d'),P=[...Array(90)].map(()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,r:Math.random()*5+3,c:['#d9437a','#5b3a8c','#1f9d7a','#f5b83d'][Math.random()*4|0]}));let f=0;(function a(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<110)requestAnimationFrame(a);else c.remove()})()}
function gain(n,t){const q=today(),b=lvOf(S.xp);S.act=S.act||{};S.act[dk(Date.now())]=1;if(t)q[t]++;S.xp=(S.xp||0)+n;pop('+'+n+' XP');
  if(!q.done&&q.rev>=10&&q.foc>=1&&q.task>=1){q.done=true;S.xp+=30;pop('Xong nhiệm vụ ngày! +30 XP',1);boom()}
  if(lvOf(S.xp)>b){pop('Lên cấp '+lvOf(S.xp)+': '+lvInfo(S.xp).rank,1);boom()}
  save();hud()}
const _rate=rate;rate=function(q){_rate(q);gain(q?10:3,'rev')};
const _tick=tick;tick=function(id){const was=S.tasks.find(x=>x.id==id).done;_tick(id);if(!was)gain(15,'task')};
const _beep=beep;beep=function(){_beep();if(T.mode=='f'){gain(25,'foc');pop('Hộp quà: '+FACTS[Math.random()*FACTS.length|0],1)}};
const _go=go;go=function(n){_go(n);hud();document.querySelectorAll('[data-n]').forEach(e=>cnt(e,+e.dataset.n))};
function starter(){const N=[["I","Khứu giác","Cảm giác (mùi)"],["II","Thị giác","Cảm giác (thị lực)"],["III","Vận nhãn","Vận động (đa số cơ vận nhãn, co đồng tử)"],["IV","Ròng rọc","Vận động (cơ chéo trên)"],["V","Sinh ba","Hỗn hợp (cảm giác mặt, vận động cơ nhai)"],["VI","Vận nhãn ngoài","Vận động (cơ thẳng ngoài)"],["VII","Mặt","Hỗn hợp (biểu cảm mặt, vị giác 2/3 trước lưỡi)"],["VIII","Tiền đình ốc tai","Cảm giác (thính giác, thăng bằng)"],["IX","Thiệt hầu","Hỗn hợp (vị giác 1/3 sau lưỡi, nuốt)"],["X","Lang thang","Hỗn hợp (phó giao cảm nội tạng, thanh quản)"],["XI","Phụ","Vận động (cơ thang, ức đòn chũm)"],["XII","Hạ thiệt","Vận động (cơ lưỡi)"]];
  S.cards.push(...N.map((n,i)=>({id:Date.now()+i,s:"Giải phẫu",q:`Dây thần kinh sọ ${n[0]} tên là gì và chức năng?`,a:`${n[1]}: ${n[2]}`,due:Date.now(),iv:0,ef:2.5})));save();go('cards')}

V.home=function(){
  const now=Date.now(),I=lvInfo(S.xp),q=today(),h=new Date().getHours(),due=S.cards.filter(c=>c.due<=now).length;
  const pend=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'));
  const rev=Object.values(S.rev).reduce((a,b)=>a+b,0),mins=S.log.reduce((a,l)=>a+l.m,0),st=streak();
  const Q=[['Ôn 10 thẻ',Math.min(q.rev,10),10,'cards'],['Tập trung 25 phút',Math.min(q.foc,1),1,'timer'],['Hoàn thành 1 việc',Math.min(q.task,1),1,'tasks']];
  const cells=[...Array(84)].map((_,i)=>{const k=dk(now-(83-i)*864e5),v=minsOn(k)/25+(S.rev[k]||0)/10+((S.act||{})[k]?.5:0);return`<s class="l${v>=3?4:v>=2?3:v>=1?2:v>0?1:0}" title="${k}"></s>`}).join('');
  const B=[['Thẻ đầu tiên',S.cards.length>=1],['Ôn 50 thẻ',rev>=50],['Chuỗi 3 ngày',st>=3],['Chuỗi 7 ngày',st>=7],['10 giờ tập trung',mins>=600],['Cấp 5',I.l>=5]];
  $('#v').innerHTML=`<section class="hero"><div><h1>${h<11?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối'}!</h1><p>${I.rank}. Còn ${Math.ceil(I.need)} XP nữa là lên cấp ${I.l+1}.</p>
  <div class="chips"><span>🔥 ${st} ngày liên tiếp</span><span>⏱ ${minsOn(dk(now))} phút hôm nay</span><span>🃏 ${due} thẻ cần ôn</span></div></div>
  <div class="lv" style="--p:${I.p}"><div><p><b data-n="${I.l}">0</b><span>cấp</span></p></div></div>
  <svg class="ecg" viewBox="0 0 600 60" preserveAspectRatio="none"><path pathLength="600" d="M0 30H70l8-6 8 6H130l6 8 10-34 10 44 6-18H230l12-12 14 12H330l6 8 10-34 10 44 6-18H430l12-12 14 12H520l6 8 10-26 10 34 6-16H600"/></svg></section>
  ${S.cards.length?'':'<div class="box"><h2>Bắt đầu nhanh</h2><button class="btn" onclick="starter()">Nạp bộ thẻ 12 dây thần kinh sọ</button></div>'}
  <div class="box"><h2>Nhiệm vụ hôm nay ${q.done?'(đã nhận thưởng +30 XP)':'(xong cả 3 nhận +30 XP)'}</h2>${Q.map(x=>`<button class="qr" onclick="go('${x[3]}')"><span>${x[0]}</span><div class="bar"><u style="width:${x[1]/x[2]*100}%"></u></div><b>${x[1]}/${x[2]}</b></button>`).join('')}</div>
  <div class="box"><h2>12 tuần gần nhất</h2><div class="heatw"><div class="heat">${cells}</div></div></div>
  <div class="box"><h2>Sắp tới</h2>${pend.slice(0,4).map(taskRow).join('')||'<p class="empty">Chưa có việc nào. Thêm deadline ở mục Lịch & Deadline.</p>'}</div>
  <div class="box"><h2>Huy hiệu</h2>${B.map(b=>`<span class="bd ${b[1]?'':'lock'}">${b[1]?'🏅':'🔒'} ${b[0]}</span>`).join('')}</div>`};

let Z=null;
V.quiz=function(){
  if(S.cards.length<4){$('#v').innerHTML=`<h1>Thử thách</h1><p class="sub">Cần ít nhất 4 thẻ để tạo câu trắc nghiệm.</p><div class="box"><button class="btn" onclick="starter()">Nạp bộ thẻ 12 dây thần kinh sọ</button></div>`;return}
  Z={n:0,ok:0,pool:[...S.cards].sort(()=>Math.random()-.5).slice(0,5)};zq()};
function zq(){
  if(Z.n>=Z.pool.length){const good=Z.ok>=4;if(good)boom();gain(Z.ok*5+5);$('#v').innerHTML=`<h1>Kết quả: ${Z.ok}/${Z.pool.length}</h1><p class="sub">${good?'Xuất sắc! Kiến thức đang vào đầu rồi.':'Các thẻ sai đã được xếp lên đầu hàng ôn để bạn sửa ngay.'}</p><div class="box"><button class="btn" onclick="V.quiz()">Chơi lại</button> <button class="btn g" onclick="go('cards')">Ôn thẻ</button></div>`;return}
  const c=Z.pool[Z.n],o=[c,...S.cards.filter(x=>x.id!=c.id&&x.a!=c.a).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  $('#v').innerHTML=`<h1>Thử thách</h1><p class="sub">Câu ${Z.n+1}/${Z.pool.length}. Đúng được +5 XP, sai thì thẻ quay lại ngay để bạn nhớ lâu hơn.</p><div class="bar"><u style="width:${Z.n/Z.pool.length*100}%"></u></div>
  <div class="fc" style="margin:14px 0"><span class="tag" style="align-self:center">${esc(c.s)}</span><div class="q">${esc(c.q)}</div></div>${o.map(x=>`<button class="opt" onclick="zans(this,${x.id==c.id})">${esc(x.a.slice(0,90))}</button>`).join('')}`}
function zans(b,ok){const c=Z.pool[Z.n],L=document.querySelectorAll('.opt');L.forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');
  if(ok)Z.ok++;else{c.due=Date.now();c.iv=0;L.forEach(x=>{if(x.textContent==c.a.slice(0,90))x.classList.add('ok')});save()}
  setTimeout(()=>{Z.n++;zq()},ok?700:1600)}

go('home');
</script>
</body>
</html>
